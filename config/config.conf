# rna_ends2tracks configuration — the only per-run configuration file.
# Values use a restricted KEY=value grammar. Shell commands and substitutions are rejected.

# Project paths
PROJECT_ID="quantseq_rev_project"
SAMPLESHEET="/path/to/project/config/samplesheet.csv"
OUTPUT_DIR="/path/to/project/results"
TMP_DIR="/path/to/project/tmp"

# Independent modules
RUN_GENE_EXPRESSION=true
RUN_APA_A_MCELL2019=true
RUN_APA_B=false
APA_B_PILOT_ACCEPTED=false
# "auto" invokes the separately installed, pinned PolyAseqTrap/DeepIP adapter.
APA_B_COMMAND_TEMPLATE="auto"
APA_B_VALIDATION_MANIFEST=""
APA_B_INSTALLATION_MANIFEST="/opt/conda_envs/rna_ends2tracks-apa-b-0.1.0a10.post6/installation_manifest.json"
APA_B_THREADS=12
# "auto" reuses receipt-validated C1+C1S and falls back to BAM only when absent.
APA_B_ENDPOINT_SOURCE="auto"
APA_B_ENDPOINT_PARALLEL_JOBS=12
APA_B_CLUSTER_PARALLEL_JOBS=12
APA_B_DEEPIP_THREADS=12

# Gene-set enrichment. KEGG is deliberately unavailable until a licensed, pinned source is approved.
RUN_DGE_ENRICHMENT=true
RUN_APA_ENRICHMENT=true
ENRICHMENT_ORA=true
ENRICHMENT_GSEA=true
ENRICHMENT_GO=true
ENRICHMENT_REACTOME=true
ENRICHMENT_HALLMARKS=true
ENRICHMENT_KEGG=false
ENRICHMENT_PADJ=0.05
ENRICHMENT_DGE_MIN_ABS_LFC=1.0
ENRICHMENT_APA_MIN_ABS_DELTA_PAU=0.10
ENRICHMENT_MIN_GENESET_SIZE=10
ENRICHMENT_MAX_GENESET_SIZE=500
ENRICHMENT_PARALLEL_JOBS=6
RUN_TRACKS=true
# Publish all-read raw/CPM tracks immediately after alignment; the final track stage reuses them.
GENERATE_EARLY_C0_TRACKS=true

# Annotation-aware post-alignment QC. Empty *_RSEQC_BED values make the
# workflow generate an exact BED12 transcript reference from the selected GTF.
RUN_RSEQC=true
RSEQC_INFER_EXPERIMENT=true
RSEQC_READ_DISTRIBUTION=true
RSEQC_GENE_BODY_COVERAGE=true
RSEQC_MULTIQC=true
RSEQC_SAMPLE_READS=200000
RSEQC_MIN_TRANSCRIPT_LENGTH=100

# QuantSeq REV V2 single-end, no UMI
LIBRARY_PROTOCOL="quantseq_rev_v2_se"
LIBRARY_LAYOUT="single_end"
UMI_PRESENT=false
MAPPING_POLICY="unique_primary"
END_SOFT_CLIP_POLICY="exclude_and_report"
BBDUK_REFERENCE="adapters,polyA_T"
TRIM_QUALITY=10
MINIMUM_READ_LENGTH=20
ORIENTATION_MIN_FRACTION=0.75

# Assembly-matched, shared reference assets
HG38_STAR_INDEX="/shared/references/human/GRCh38/STAR_index"
HG38_FASTA="/shared/references/human/GRCh38/genome.fa"
HG38_GTF="/shared/references/human/GRCh38/gencode.v42.gtf"
HG38_CHROM_SIZES="/shared/references/human/GRCh38/GRCh38.chrom.sizes"
HG38_PAS_ATLAS="/shared/references/human/GRCh38/GRCh38_gencode_v42_pas_atlas_v1"
HG38_RSEQC_BED=""
MM39_STAR_INDEX="/shared/references/mouse/GRCm39/STAR_index"
MM39_FASTA="/shared/references/mouse/GRCm39/genome.fa"
MM39_GTF="/shared/references/mouse/GRCm39/gencode.vM31.gtf"
MM39_CHROM_SIZES="/shared/references/mouse/GRCm39/GRCm39.chrom.sizes"
MM39_PAS_ATLAS="/shared/references/mouse/GRCm39/GRCm39_gencode_vM31_pas_atlas_v1"
MM39_RSEQC_BED=""

# Statistics. Empty CONDITION_ORDER uses first appearance in the samplesheet.
MIN_REPLICATES_PER_CONDITION=2
CONDITION_ORDER=""
DESIGN="~ condition"
PAIRING_MODE="auto"
PAIRING_COLUMN="subject"
INCOMPLETE_PAIR_ACTION="error"
AMBIGUOUS_GENE_POLICY="exclude_statistics"
FDR=0.05
MIN_ABS_DELTA_PAU=0.10

# Mcell2019 parameters. Changing a fixed value marks the method modified.
INTERNAL_PRIMING_CONSECUTIVE_BASES=6
INTERNAL_PRIMING_WINDOW_NT=10
INTERNAL_PRIMING_MIN_BASES_IN_WINDOW=7
PAS_MASK_RESCUE_TIER="core"
PAS_DISCOVERY_WINDOW_NT=30
PAS_DISCOVERY_THRESHOLD=30
PAS_DISCOVERY_THRESHOLD_OPERATOR="greater_than"
PAS_DISCOVERY_ROUNDS=2
GENE_DOWNSTREAM_EXTENSION_NT=6000

# Bounded parallel execution
MAX_TOTAL_THREADS=48
MAX_TOTAL_MEMORY_GB=384
# Run the DGE-then-final-tracks branch, APA-A and APA-B concurrently after
# active-PAS discovery. The resource planner validates their combined peak.
PARALLEL_DOWNSTREAM_MODULES=true
DOWNSTREAM_MODULE_PARALLEL_JOBS=3
PREPROCESS_PARALLEL_JOBS=4
FASTQC_THREADS=4
BBDUK_THREADS=8
BBDUK_MEMORY_GB=8
STAR_PARALLEL_JOBS=4
STAR_THREADS=12
STAR_MEMORY_GB=48
SAMTOOLS_THREADS=6
SAMTOOLS_SORT_MEMORY_PER_THREAD_GB=2
SAMPLE_MERGE_PARALLEL_JOBS=4
RSEQC_PARALLEL_JOBS=6
RSEQC_MEMORY_GB=4
END_EXTRACTION_PARALLEL_JOBS=8
TRACK_PARALLEL_JOBS=8
TRACK_THREADS=4
DGE_CONTRAST_PARALLEL_JOBS=3
# New projects should tune APA-A and APA-B independently.  If either value is
# blank, the legacy APA_CONTRAST_PARALLEL_JOBS value is used for that method.
APA_A_CONTRAST_PARALLEL_JOBS=4
APA_B_CONTRAST_PARALLEL_JOBS=4
APA_CONTRAST_PARALLEL_JOBS=4

# Track families
GENERATE_ALL_READ_TRACKS=true
GENERATE_EXACT_END_TRACKS=true
GENERATE_FILTERED_END_TRACKS=true
GENERATE_REJECTED_END_TRACKS=true
GENERATE_ACTIVE_PAS_TRACKS=true
GENERATE_RAW_TRACKS=true
GENERATE_CPM_TRACKS=true
GENERATE_DESEQ2_FINAL_TRACKS=true
GENERATE_DESEQ2_ROBUST_CPM_FINAL_TRACKS=true
# At least one of GENERATE_BIGWIGS or RETAIN_BEDGRAPH/KEEP_BEDGRAPHS must be true.
GENERATE_BIGWIGS=true
RETAIN_BEDGRAPH=false
# Optional public directory containing a flat copy of the generated BigWigs.
# Use a plain URL (not Markdown). Empty produces relative bigDataUrl values for later editing.
UCSC_BIGDATA_URL_PREFIX=""
# Minus BigWigs contain negative values. This UCSC display option shows their magnitude above zero.
UCSC_NEGATE_MINUS_TRACKS=true
UCSC_VIEW_LIMITS="0:12"

# Success-only cleanup
CLEANUP_INTERMEDIATES=true
KEEP_TRIMMED_FASTQ=false
KEEP_LANE_BAMS=false
# Reserved for future per-read extraction shards; final C1/C1S/C2/C2R tables are always retained.
KEEP_APA_SAMPLE_EXTRACTION=false
KEEP_TRACK_STRAND_BAMS=false
KEEP_BEDGRAPHS=false
