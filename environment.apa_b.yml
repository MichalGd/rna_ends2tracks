name: rna_ends2tracks-apa-b-v1
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python 3.10 is the newest release supported by TensorFlow 2.10 and also
  # satisfies the workflow package's Python >=3.10 contract.
  - python=3.10
  - pip
  - pysam=0.23
  - numpy=1.23.5
  - pandas=1.5
  - scikit-learn=1.2
  - h5py=3.7
  - r-base=4.3
  - bioconductor-rsamtools
  - bioconductor-biostrings
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-biocgenerics
  - bioconductor-limma
  - r-stringr
  - r-plyr
  - r-dplyr
  - r-tibble
  - r-outliers
  - r-pbmcapply
  - r-stringdist
  # The conda-forge TensorFlow 2.10 build requires ICU 70, whereas R 4.3
  # requires ICU >=72. Install the official CPU wheel after the compatible
  # Conda R/Python stack is solved. This also follows DeepIP's pip-based
  # installation instructions and avoids any CUDA dependency.
  - pip:
      - tensorflow-cpu==2.10.1
      - keras==2.10.0
