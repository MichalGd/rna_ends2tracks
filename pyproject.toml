[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-ends2tracks"
version = "0.1.0a12.post1"
description = "Portable QuantSeq REV gene-expression and alternative-polyadenylation workflow"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "pysam>=0.22,<0.24",
]

[project.scripts]
rna-ends2tracks = "rnaends2tracks.cli:main"
rna-ends2tracks-apa-b = "rnaends2tracks.polyaseqtrap_adapter:main"
rna-ends2tracks-accept-apa-b-pilot = "rnaends2tracks.apa_b_pilot:main"
rna-ends2tracks-run-apa-b-synthetic-pilot = "rnaends2tracks.apa_b_synthetic_pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/rna_ends2tracks/scripts/R" = ["scripts/R/*.R"]
"share/rna_ends2tracks/scripts" = ["scripts/build_pas_atlas.py", "scripts/prepare_pas_sources.py"]
"share/rna_ends2tracks/resources" = ["resources/*.fa"]
"share/rna_ends2tracks/config" = ["config/config.conf", "config/samplesheet.csv", "config/apa_b_validation.example.json"]
"share/rna_ends2tracks/docs" = ["docs/*.md"]
