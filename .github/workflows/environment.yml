name: Complete environment

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - environment.yml
      - environment.apa_b.yml
      - .github/workflows/environment.yml
      - pyproject.toml
      - src/**
      - scripts/R/**
      - scripts/bash/install_apa_b.sh
      - tests/**
  pull_request:
    paths:
      - environment.yml
      - environment.apa_b.yml
      - .github/workflows/environment.yml
      - pyproject.toml
      - src/**
      - scripts/R/**
      - scripts/bash/install_apa_b.sh
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          cache-downloads: true
          cache-environment: true
          post-cleanup: all
      - name: Verify required tools and packages
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          command -v python STAR samtools featureCounts bbduk.sh fastqc fastq_screen bowtie2 multiqc bedtools bedGraphToBigWig Rscript
          python -c 'import yaml, pysam; print(yaml.__version__, pysam.__version__)'
          STAR --version
          samtools --version
          featureCounts -v
          printf '@rev_smoke\nACGTCGATGCTAGCTACGATCGTA\n+\nIIIIIIIIIIIIIIIIIIIIIIII\n' > rev_smoke.fastq
          bbduk.sh in=rev_smoke.fastq out=rev_smoke.trimmed.fastq ref=resources/quantseq_rev_adapters.fa int=f k=13 ktrim=r useshortkmers=t mink=5 qtrim=r trimq=10 minlength=20 threads=1
          test -s rev_smoke.trimmed.fastq
          fastq_screen --version
          bowtie2 --version
          Rscript -e 'packages <- c("DESeq2", "DEXSeq", "DRIMSeq", "stageR", "fgsea", "msigdbr", "ggplot2"); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly=TRUE))); print(sessionInfo())'
          Rscript scripts/R/gene_set_enrichment.R --self-test
      - name: Run package and mixed-pairing integration tests
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m pip install --no-deps .
          python -m unittest discover -s tests -p 'test_*.py' -v
          Rscript tests/R/deseq2_pairing_smoke.R
          Rscript scripts/R/drimseq_stager_all_pairs.R --self-test

  apa-b-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.apa_b.yml
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          cache-downloads: true
          cache-environment: true
          post-cleanup: all
      - name: Verify APA-B R and CPU TensorFlow runtimes
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -c 'import keras, tensorflow as tf; assert keras.__version__ == "2.10.0"; assert tf.__version__ == "2.10.1"; assert not tf.config.list_physical_devices("GPU"); print("DeepIP TensorFlow CPU runtime: PASS")'
          Rscript -e 'packages <- c("Rsamtools", "Biostrings", "GenomicRanges", "IRanges", "limma", "stringr", "plyr", "dplyr", "tibble", "outliers", "pbmcapply", "stringdist"); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly=TRUE))); print(sessionInfo())'
