name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests scripts/build_pas_atlas.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - name: Installed-package asset smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from rnaends2tracks.paths import workflow_asset; assert workflow_asset("scripts/R/deseq2_c4.R").is_file(); assert workflow_asset("scripts/build_pas_atlas.py").is_file(); assert workflow_asset("resources/quantseq_rev_adapters.fa").is_file(); assert workflow_asset("config/config.conf").is_file()'

  shell-and-r-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find bin scripts/bash tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find bin scripts/bash tests -type f -name '*.sh' -print0 | xargs -0 shellcheck
          bash tests/test_install_release_immutability.sh
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R modules
        shell: Rscript {0}
        run: |
          files <- list.files("scripts/R", pattern="[.]R$", full.names=TRUE)
          stopifnot(length(files) == 4L)
          invisible(lapply(files, parse))

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install check-jsonschema PyYAML
      - name: Validate JSON schemas against their declared metaschema
        run: |
          check-jsonschema --check-metaschema schemas/project.schema.json
          check-jsonschema --check-metaschema schemas/samplesheet.schema.json
      - name: Reject generated or sensitive paths
        run: |
          ! git ls-files | grep -E '(^|/)(results|__pycache__|\.conda|envs?)/|[.](fastq|fq)[.]gz$|[.]bam$|[.]bai$|[.]bw$'
          ! grep -RInE 'C:\\Users\\|/home/[^ /]+|D:\\bioinformatics' --exclude=ci.yml --exclude=workflowRevision.md --exclude-dir=.git .
